name: CI

on:
  push:
    branches: [master]
  pull_request:

# Sem isso, um push rápido seguido de outro deixa dois runs concorrentes
# gastando minutos de CI à toa — cancela o anterior do mesmo branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Padrão mínimo: o token da run só pode ler o repo. Nenhum job abaixo
# precisa escrever (comentar PR, publicar pacote, etc.) nem usa secrets —
# então não há credencial nenhuma exposta a um PR de fora.
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Rodar suíte (unit + integration, SQLite local)
        run: pytest -q

  frontend-checks:
    name: Frontend (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Versão travada (não "stable") pra não quebrar quando o canal
      # avançar sozinho — atualizar deliberadamente junto com o SDK local
      # (ver frontend/.metadata) quando fizer sentido.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes de widget
        run: flutter test
